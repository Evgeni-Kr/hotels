databaseChangeLog:
  - changeSet:
      id: 001-create-hotel
      author: dev
      changes:
        - createTable:
            tableName: hotel
            columns:
              - column: { name: id,           type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name,          type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: description,   type: TEXT }
              - column: { name: brand,         type: VARCHAR(255), constraints: { nullable: false } }

              - column: { name: house_number,  type: INT }
              - column: { name: street,        type: VARCHAR(255) }
              - column: { name: city,          type: VARCHAR(255) }
              - column: { name: country,       type: VARCHAR(255) }
              - column: { name: postal_code,     type: VARCHAR(20) }

              - column: { name: phone,         type: VARCHAR(50) }
              - column: { name: email,         type: VARCHAR(255) }

              - column: { name: check_in,      type: VARCHAR(10) }
              - column: { name: check_out,     type: VARCHAR(10) }

  - changeSet:
      id: 002-create-amenity
      author: dev
      changes:
        - createTable:
            tableName: amenity
            columns:
              - column: { name: id,   type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false, unique: true } }

  - changeSet:
      id: 003-create-hotel-amenity
      author: dev
      changes:
        - createTable:
            tableName: hotel_amenity
            columns:
              - column: { name: hotel_id,   type: BIGINT, constraints: { nullable: false } }
              - column: { name: amenity_id, type: BIGINT, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: hotel_amenity
            columnNames: hotel_id, amenity_id
        - addForeignKeyConstraint:
            baseTableName:         hotel_amenity
            baseColumnNames:       hotel_id
            referencedTableName:   hotel
            referencedColumnNames: id
            constraintName:        fk_ha_hotel
            onDelete:              CASCADE
        - addForeignKeyConstraint:
            baseTableName:         hotel_amenity
            baseColumnNames:       amenity_id
            referencedTableName:   amenity
            referencedColumnNames: id
            constraintName:        fk_ha_amenity
            onDelete:              CASCADE

  - changeSet:
      id: 004-seed-data
      author: dev
      changes:
        - insert:
            tableName: hotel
            columns:
              - column: { name: name,         value: "DoubleTree by Hilton Minsk" }
              - column: { name: description,  value: "The DoubleTree by Hilton Hotel Minsk offers 193 luxurious rooms in the Belorussian capital and stunning views of Minsk city from the hotel's 20th floor ..." }
              - column: { name: brand,        value: "Hilton" }
              - column: { name: house_number, valueNumeric: 9 }
              - column: { name: street,       value: "Pobediteley Avenue" }
              - column: { name: city,         value: "Minsk" }
              - column: { name: country,      value: "Belarus" }
              - column: { name: postal_code,    value: "220004" }
              - column: { name: phone,        value: "+375 17 309-80-00" }
              - column: { name: email,        value: "doubletreeminsk.info@hilton.com" }
              - column: { name: check_in,     value: "14:00" }
              - column: { name: check_out,    value: "12:00" }
        - insert: { tableName: amenity, columns: [ { column: { name: name, value: "Free parking" } } ] }
        - insert: { tableName: amenity, columns: [ { column: { name: name, value: "Free WiFi" } } ] }
        - insert: { tableName: amenity, columns: [ { column: { name: name, value: "Non-smoking rooms" } } ] }
        - insert: { tableName: amenity, columns: [ { column: { name: name, value: "Fitness center" } } ] }
        - insert: { tableName: amenity, columns: [ { column: { name: name, value: "On-site restaurant" } } ] }
        - insert: { tableName: hotel_amenity, columns: [ { column: { name: hotel_id, valueNumeric: 1 } }, { column: { name: amenity_id, valueNumeric: 1 } } ] }
        - insert: { tableName: hotel_amenity, columns: [ { column: { name: hotel_id, valueNumeric: 1 } }, { column: { name: amenity_id, valueNumeric: 2 } } ] }
        - insert: { tableName: hotel_amenity, columns: [ { column: { name: hotel_id, valueNumeric: 1 } }, { column: { name: amenity_id, valueNumeric: 3 } } ] }
        - insert: { tableName: hotel_amenity, columns: [ { column: { name: hotel_id, valueNumeric: 1 } }, { column: { name: amenity_id, valueNumeric: 4 } } ] }
        - insert: { tableName: hotel_amenity, columns: [ { column: { name: hotel_id, valueNumeric: 1 } }, { column: { name: amenity_id, valueNumeric: 5 } } ] }